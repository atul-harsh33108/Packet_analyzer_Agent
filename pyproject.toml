[project]
name = "dpi-engine"
version = "0.2.0"
description = "Deep packet inspection over pcap files: classify by TLS/HTTP/DNS/QUIC, apply blocking rules, write a filtered capture."
readme = "README.md"
authors = [
    { name = "Atul Harsh", email = "atulsuper26@gmail.com" }
]
requires-python = ">=3.13,<3.14"
# Runtime stays deliberately tiny: pcap framing and header dissection only.
dependencies = [
    "dpkt>=1.9.8",
]

[project.optional-dependencies]
# The MCP server (`T3-05`, `DEC-09`): an **optional** extra, never a core
# dependency. The runtime stays `dpkt` alone -- the SDK brings an ASGI server,
# a web framework and an HTTP client with it, and a pcap analyser should not
# make every user install a web stack.
mcp = [
    "mcp>=2.3,<3",
]
# QUIC Initial packets are encrypted with keys derived from the cleartext DCID,
# so a passive observer can decrypt them -- but that needs real AES, and this
# project will not hand-roll a block cipher. Detection and classification as
# "QUIC" work without this; only SNI extraction is gated on it. See quic.py.
quic = [
    "cryptography>=42",
]

[project.scripts]
dpi-engine = "dpi_engine.cli:main"
dpi-mcp = "dpi_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "scapy>=2.6.1",
    # In the dev group as well as the [quic] extra so the QUIC test suite
    # actually runs in CI rather than silently skipping.
    "cryptography>=42",
    # The MCP SDK as well as the [mcp] extra, for the same reason as QUIC
    # above: so the stdio handshake test actually runs in CI rather than
    # silently skipping. `DEC-09` made the SDK an optional extra, not an
    # optional *test* -- a test that skips when a dependency is missing is not
    # evidence that anything works.
    "mcp>=2.3,<3",
    # Lint + typecheck. Both are configured in this file (see [tool.ruff] and
    # [tool.mypy]) so `uv run ruff check` and `uv run mypy` are reproducible
    # for anyone who clones the repo.
    "ruff>=0.9",
    "mypy>=1.14",
    # Coverage gate and a per-test timeout. The timeout is not cosmetic: a
    # regression into a known hang path (a worker that never receives its
    # shutdown sentinel, an LB that dies leaving its fast-paths blocked) would
    # otherwise hang the suite forever instead of failing it. See
    # [tool.pytest.ini_options] below.
    "pytest-cov>=6.0",
    "pytest-timeout>=2.3",
    "pytest-benchmark>=5.3.0",
    # Property-based fuzzing for the byte-level extractors (R-05). Every defect
    # closed in Phase 0 was an adversarial-input defect, and none of them was
    # found by an example-based test. Hypothesis generates the awkward inputs
    # instead of waiting for someone to think of them.
    "hypothesis>=6.100",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
# OSC/ is the preserved C++ original plus its own Python fixture generator. It
# is reference material, not part of this port, and is held to its own
# conventions.
extend-exclude = ["OSC"]

[tool.ruff.lint]
# E/W: pycodestyle. F: pyflakes. I: import sorting. UP: pyupgrade.
# B: bugbear. SIM: simplifications. RUF: ruff-specific rules.
# The default set is E4/E7/E9 + F; the rest are added deliberately.
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # Line length is handled by the formatter, and several report/docstring
    # lines are prose that reads worse when hard-wrapped.
    "E501",
    # `assert` in tests is the point; in library code, asserts are used only
    # for narrowing and are documented as such.
    "B011",
]

[tool.ruff.lint.per-file-ignores]
# Tests intentionally construct malformed input and use asserts as assertions.
"tests/**" = ["B015", "SIM117", "RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["dpi_engine"]

[tool.mypy]
python_version = "3.13"
packages = ["dpi_engine", "dpi_mcp", "dpi_agents", "dpi_model_client"]  # every package under src/, asserted by
# tests/test_project_packaging.py. Without dpi_mcp here, mypy reports
# "Success: no issues found" having inspected none of it.
strict = true
warn_unreachable = true
# The multiprocessing entry points take `multiprocessing.Queue` objects, which
# are typed as `Any` in typeshed; there is nothing useful to assert about them.
[[tool.mypy.overrides]]
module = ["dpkt.*", "scapy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
# Benchmarks are opt-in. `--benchmark-enable` forcibly overrides this, so
# `pytest tests/benchmarks --benchmark-enable` works while a normal run stays
# fast and free of machine-specific output. See tests/benchmarks/.
addopts = "--benchmark-disable"
# Every test gets a wall-clock ceiling. The slowest test at the time of writing
# runs in ~1.6s, so 30s is roughly 19x headroom -- generous enough for a loaded
# CI machine, tight enough that a hang is reported as a failure within half a
# minute instead of stalling the run indefinitely.
timeout = 30
# Deliberately left at pytest-timeout's default (signal where available, thread
# otherwise) rather than pinned. Pinning to `thread` for consistency would make
# a Linux CI timeout kill the whole pytest process instead of failing the one
# test, which is worse behaviour precisely where it matters most.
markers = [
    "slow: multiprocessing stress tests; given a longer timeout via the marker",
]

[tool.coverage.run]
source = ["dpi_engine"]
branch = true
# The differential suite shells out to Docker to build the C++ reference
# binary; coverage of the containerised build is not meaningful and not ours.
omit = ["*/__main__.py"]

[tool.coverage.report]
# Measured 93% before this gate existed (see TASK_TRACKER T0-01). 85 leaves
# headroom for genuinely unreachable defensive branches while still failing if
# a change quietly deletes tested code.
fail_under = 85
show_missing = true
# These are one-line re-export/summary helpers; the indirect coverage they get
# is more honest than an exclusion nobody reviews.
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The package is fully annotated and ships a py.typed marker (PEP 561), so
# downstream users get the types. Without listing it here the marker would be
# excluded from the wheel.
# A list, not one name: the uv backend packages exactly what is listed here, and a
# single name silently omitted src/dpi_mcp from the built wheel.
module-name = ["dpi_engine", "dpi_mcp", "dpi_agents", "dpi_model_client"]
module-root = "src"
