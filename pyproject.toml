[project]
name = "dpi-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Atul Harsh", email = "atulsuper26@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "dpkt>=1.9.8",
]

[project.scripts]
